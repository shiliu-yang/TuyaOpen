      #     echo "::endgroup::"
      # - run: echo "💡 This job's status is ${{ job.status }}."
      - name: Upload Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build_logs_${{ github.run_number }}
          path: ${{ github.workspace }}/tmp/logs/build_logs_${{ github.run_number }}
          retention-days: 60  # Only keep for 60 days to avoid storage issues
          overwrite: false    # v4 does not support overwrite by default, keep as a reminder