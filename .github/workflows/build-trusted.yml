# Trusted fixed-profile build; installed bundle only, no source checkout.
name: TuyaOpen trusted local build
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      attempt_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: tuyaopen-trusted-local-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: [tuyaopen-ci-build]
    timeout-minutes: 55
    steps:
      # No checkout, PR shell commands, artifact download or credentials in compiler.
      # This dedicated native host runner is NOT the existing socket-free container runner.
      - name: Execute installed reviewed controller bundle
        shell: pwsh
        env:
          TUYAOPEN_REQUEST_ID: ${{ inputs.request_id }}
          TUYAOPEN_ATTEMPT_ID: ${{ inputs.attempt_id }}
          TUYAOPEN_DISPATCH_NONCE: ${{ inputs.nonce }}
          TUYAOPEN_BUILD_ENDPOINT: ${{ vars.TUYAOPEN_BUILD_ENDPOINT }}
          TUYAOPEN_BUILD_PYTHON: ${{ vars.TUYAOPEN_BUILD_PYTHON }}
          TUYAOPEN_BUILD_BUNDLE: ${{ vars.TUYAOPEN_BUILD_BUNDLE }}
          TUYAOPEN_BUILD_PROFILE: ${{ vars.TUYAOPEN_BUILD_PROFILE }}
          TUYAOPEN_BUILD_RESULTS: ${{ vars.TUYAOPEN_BUILD_RESULTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TUYAOPEN_BUILD_PYTHON -B (Join-Path $env:TUYAOPEN_BUILD_BUNDLE "runner_entrypoint.py") --profile $env:TUYAOPEN_BUILD_PROFILE --results-root $env:TUYAOPEN_BUILD_RESULTS
          if ($LASTEXITCODE -ne 0) { throw 'Trusted build failed' }
