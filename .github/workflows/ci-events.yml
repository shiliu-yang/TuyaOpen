name: TuyaOpen CI Build
run-name: "PR #${{ inputs.pr_number }} · TuyaOpen build"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      app_switch_demo:
        description: Build switch_demo with its T5AI default
        required: false
        type: boolean
        default: false
      app_your_chat_bot:
        description: Build your_chat_bot with its T5AI default
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tuyaopen-ci-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'shiliu-yang/TuyaOpen' && github.ref == 'refs/heads/master'
    runs-on: [tuyaopen-ci, linux, x64]
    timeout-minutes: 75
    steps:
      - name: Approve, build in Docker, and follow progress
        shell: bash
        run: |
          set -euo pipefail
          python /app/infra/build/actions_job.py

